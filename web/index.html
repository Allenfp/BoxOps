<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>BoxOps</title>
    <script>
      // The theme before the first paint, so a dark-mode visitor never sees a light flash:
      // the stored choice (prefs.ts), else the system's. prefs.ts takes over once the app runs.
      (function () {
        var theme = "system";
        try {
          var prefs = JSON.parse(localStorage.getItem("boxops-prefs") || "null");
          if (prefs && (prefs.theme === "light" || prefs.theme === "dark")) theme = prefs.theme;
          else if (!prefs && localStorage.getItem("boxops-theme") === "dark") theme = "dark";
        } catch (e) {}
        if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script>
      // Boot watchdog. Pages caches index.html for 10 minutes, so after a deploy a cached copy
      // can name app files that are gone. If the app's JavaScript fails to load, or the app
      // hasn't started within 8 s, reload once from a URL no cache can answer
      // (?boxops-reload=…, which the app removes); if it fails again, say so instead of
      // leaving a blank page. main.tsx calls __boxopsBoot() when the app starts.
      (function () {
        var KEY = "boxops-boot-retry";
        var settled = false;
        var timer = setTimeout(fail, 8000);
        window.__boxopsBoot = function () {
          settled = true;
          clearTimeout(timer);
          try {
            sessionStorage.removeItem(KEY);
          } catch (e) {}
        };
        addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT") fail();
          },
          true,
        );
        // Module scripts run before DOMContentLoaded: if the app hasn't started by then, it won't.
        addEventListener("DOMContentLoaded", function () {
          if (!settled) fail();
        });
        function fail() {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          var tried = "1";
          try {
            tried = sessionStorage.getItem(KEY);
            if (!tried) sessionStorage.setItem(KEY, "1");
          } catch (e) {}
          if (!tried) {
            var q = new URLSearchParams(location.search);
            q.set("boxops-reload", Date.now().toString(36));
            location.replace("./?" + q + location.hash);
            return;
          }
          try {
            sessionStorage.removeItem(KEY);
          } catch (e) {}
          var root = document.getElementById("root");
          var p = document.createElement("p");
          p.className = "splash error";
          p.textContent = "BoxOps couldn’t start: part of the app didn’t load. The site may be updating. ";
          var a = document.createElement("a");
          a.href = location.href;
          a.textContent = "Try again";
          p.append(a);
          if (root) root.replaceChildren(p);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><p class="splash">Loading…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
