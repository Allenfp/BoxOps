name: Feature request
description: Something BoxOps could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What BoxOps could do about it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways round it you've tried or thought of.
