# Releases BoxOps (docs/releasing.md), run by hand from main with a version:
# X.Y.Z, or X.Y.Z-rc.N for a release candidate (a prerelease); and, to be
# sure it releases what was reviewed, the commit of main reviewed.
#   preflight  main is the commit reviewed, if given; the version,
#              web/package.json and CHANGELOG.md agree; the tag is new;
#              X.Y.Z names the security contact
#   verify     all of CI on this commit (ci.yml), which builds the release
#              tree, checks it and tests it as built
#   reproduce  the release tree built again, apart: a fresh install, no cache
#   publish    once the maintainer approves the `release` environment: the
#              tested tree, if the rebuild matches it, attested (provenance,
#              and an SBOM); then committed to the `releases` branch and
#              tagged vX.Y.Z in one push with the release deploy key; and
#              published as an immutable GitHub release, its notes the
#              changelog's section. It runs no code from this repository:
#              only git, jq, tar, gh and GitHub's own actions.
# It can't run until the repository has its release settings (the `release`
# environment with the RELEASE_DEPLOY_KEY secret, the rulesets: see
# docs/releasing.md, "One-off settings").
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z, or X.Y.Z-rc.N (web/package.json says X.Y.Z, and CHANGELOG.md has its section)"
        required: true
        type: string
      commit:
        description: "The commit of main you reviewed, the release pull request's (7 to 40 hex digits): the run stops if main has moved on. Optional"
        required: false
        type: string
        default: ""

permissions: {}

# One release at a time, never cancelled midway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the repo, and look for the tag
    outputs:
      notes: ${{ steps.versions.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: From main, at the commit reviewed if given; the version, web/package.json and CHANGELOG.md agree; the tag is new; X.Y.Z names the security contact
        id: versions
        env:
          V: ${{ inputs.version }}
          REVIEWED: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error title=Releases come from main::This run is for $GITHUB_REF. Run the workflow from main."
            exit 1
          fi
          # The run releases main as it was when it started: with the commit
          # reviewed given, nothing merged since can slip in.
          if [ -n "$REVIEWED" ]; then
            reviewed=$(printf '%s' "$REVIEWED" | tr 'A-F' 'a-f')
            if ! [[ "$reviewed" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error title=Not a commit::The commit given, $REVIEWED, isn’t 7 to 40 hex digits of one."
              exit 1
            fi
            if [[ "$GITHUB_SHA" != "$reviewed"* ]]; then
              echo "::error title=main has moved on::This run is for main at $GITHUB_SHA, not $REVIEWED, the commit reviewed: see what was merged since, then run the workflow again."
              exit 1
            fi
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error title=Not a version::The version given, $V, isn’t X.Y.Z or X.Y.Z-rc.N."
            exit 1
          fi
          base=${V%%-rc.*}
          pkg=$(jq -r .version web/package.json)
          if [ "$pkg" != "$base" ]; then
            echo "::error title=web/package.json says $pkg::Releasing $V needs web/package.json at $base: bump it in the release pull request."
            exit 1
          fi
          # X.Y.Z waits for the security contact's address (docs/releasing.md,
          # "Before the first release"); a release candidate may go without.
          if [ "$V" = "$base" ] && grep -n -F '<SECURITY_CONTACT>' SECURITY.md docs/security.md; then
            echo "::error title=No security contact::SECURITY.md or docs/security.md still has the placeholder <SECURITY_CONTACT>: put the address in both, in the release pull request."
            exit 1
          fi
          node web/scripts/check-changelog.mjs --release "$base" --notes "$RUNNER_TEMP/notes/notes.md"
          echo "notes=$(sha256sum "$RUNNER_TEMP/notes/notes.md" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$V" --silent 2>"$RUNNER_TEMP/tag-error"; then
            echo "::error title=v$V exists::The tag v$V is there already, and a release is for good: release the next version."
            exit 1
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/tag-error"; then
            echo "::error title=Couldn't look for the tag v$V::$(tr '\n' ' ' <"$RUNNER_TEMP/tag-error")"
            exit 1
          fi
          echo "Releasing BoxOps $V from main@${GITHUB_SHA:0:12}."
      # Kept 35 days, the longest a run can last: publish downloads the notes
      # once the maintainer approves, which can take up to 30 (and CI's
      # release tree is kept as long).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error
          retention-days: 35

  verify:
    name: verify
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: read # what ci.yml's jobs ask for

  reproduce:
    name: reproduce
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repo
    outputs:
      tree: ${{ steps.rebuilt.outputs.tree }}
      sums: ${{ steps.rebuilt.outputs.sums }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: an install of its own, from the registry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build the release tree again
        id: rebuilt
        env:
          V: ${{ inputs.version }}
        run: |
          npm run release:build -- --version "$V" --no-sbom
          echo "tree=$(cat ../build/TREE)" >>"$GITHUB_OUTPUT"
          echo "sums=$(sha256sum ../build/SHA256SUMS | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      # To compare by hand with CI's when they differ (publish uses the
      # outputs, and finds out once approved): kept as long as CI's.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproduce
          path: |
            build/TREE
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 35

  publish:
    name: publish
    needs: [preflight, verify, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The maintainer approves this job; the environment holds the release
    # deploy key and lets only main use it.
    environment: release
    permissions:
      contents: write # make the GitHub release (the commit and tag go with the deploy key)
      id-token: write # sign the attestations
      attestations: write # keep them
    env:
      V: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tree
          path: built
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      # The release commit is the tested tree, byte for byte: git's id for
      # the downloaded files, and their SHA256SUMS' SHA-256, must be what
      # CI's release tree job and the rebuild gave as outputs, the SBOM what
      # CI's built, and the notes what preflight checked. Job outputs: no
      # later job can change one, where any job of this run could replace an
      # artifact.
      - name: The tree to ship is the tested tree, and the rebuild's
        env:
          TESTED_TREE: ${{ needs.verify.outputs.tree }}
          TESTED_SUMS: ${{ needs.verify.outputs.sums }}
          TESTED_SBOM: ${{ needs.verify.outputs.sbom }}
          REBUILT_TREE: ${{ needs.reproduce.outputs.tree }}
          REBUILT_SUMS: ${{ needs.reproduce.outputs.sums }}
          NOTES_SHA256: ${{ needs.preflight.outputs.notes }}
        run: |
          set -euo pipefail
          if ! [[ "$TESTED_TREE" =~ ^[0-9a-f]{40}$ && "$TESTED_SUMS" =~ ^[0-9a-f]{64}$ ]] || [ "$REBUILT_TREE" != "$TESTED_TREE" ] || [ "$REBUILT_SUMS" != "$TESTED_SUMS" ]; then
            echo "::error title=The rebuild isn't the tested tree::CI tested tree ${TESTED_TREE:-(none)}, SHA256SUMS ${TESTED_SUMS:-(none)}; the rebuild made ${REBUILT_TREE:-(none)}, SHA256SUMS ${REBUILT_SUMS:-(none)}."
            exit 1
          fi
          echo "$TESTED_SUMS  built/SHA256SUMS" | sha256sum --check --quiet --strict -
          echo "$TESTED_SBOM  built/sbom.spdx.json" | sha256sum --check --quiet --strict -
          echo "$NOTES_SHA256  notes/notes.md" | sha256sum --check --quiet --strict -
          (cd built/release && sha256sum --check --quiet --strict ../SHA256SUMS)
          [ "$(find built/release -type f | wc -l)" -eq "$(wc -l <built/SHA256SUMS)" ]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_DIR="$RUNNER_TEMP/release.git" GIT_INDEX_FILE="$RUNNER_TEMP/release.index"
          git init -q --bare "$GIT_DIR"
          git -C built/release --work-tree=. -c core.autocrlf=false -c core.fileMode=true add --all --force .
          tree=$(git write-tree)
          if [ "$tree" != "$TESTED_TREE" ]; then
            echo "::error title=Not the tested tree::The downloaded files make tree $tree; the tests ran on $TESTED_TREE."
            exit 1
          fi
          echo "TREE=$tree" >> "$GITHUB_ENV"
      # Attested before anything is pushed: a tag is never out without its
      # attestations (Dependabot would offer it, while `gh attestation
      # verify` and doctor fail). On a re-run, attesting the same files
      # again does no harm.
      - name: The release's files
        run: |
          set -euo pipefail
          mkdir assets
          tar -C built/release --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -czf "assets/boxops-$V.tar.gz" .
          cp built/release/dist/boxops.mjs built/SHA256SUMS built/sbom.spdx.json assets/
          # What the provenance attestation vouches for: every file of the
          # tree (named by its path in it), and the tarball.
          { cat built/SHA256SUMS; (cd assets && sha256sum "boxops-$V.tar.gz"); } >"$RUNNER_TEMP/subjects"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/boxops-${{ inputs.version }}.tar.gz
          sbom-path: assets/sbom.spdx.json
      # github.com's SSH host keys, for the push, from its API over HTTPS,
      # asked with the job's token (without one, the call counts against the
      # runner's address, which other jobs share, and can be refused): in a
      # step of its own, so that no step holds both the token and the deploy
      # key.
      - name: GitHub's SSH host keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$RUNNER_TEMP/known_hosts"
      - name: Commit the tree to releases and tag it, in one push, with the release deploy key
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release_key"
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          trap 'rm -f "$key"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_DIR="$RUNNER_TEMP/release.git"
          # GitHub's own identity for what a workflow commits, which no account can take.
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          remote="git@github.com:$GITHUB_REPOSITORY.git"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message() { printf 'BoxOps %s\n\nSource-Commit: %s\nRun: %s\n' "$V" "$GITHUB_SHA" "$run"; }
          # This job run again (Re-run failed jobs) after an attempt whose push
          # went through and a later step failed: the tag is on this run's
          # commit of the tested tree, so go on from there. On any other
          # commit, stop.
          tagged=$(git ls-remote "$remote" "refs/tags/v$V" | cut -f1)
          if [ -n "$tagged" ]; then
            git fetch -q --depth 1 "$remote" "$tagged"
            body=$(git cat-file commit "$tagged")
            if [ "$(git rev-parse "$tagged^{tree}")" != "$TREE" ] || ! grep -qxF "Source-Commit: $GITHUB_SHA" <<<"$body" || ! grep -qxF "Run: $run" <<<"$body"; then
              echo "::error title=v$V is there already::The tag v$V is on $tagged, which isn't this run's commit of the tested tree."
              exit 1
            fi
            echo "COMMIT=$tagged" >> "$GITHUB_ENV"
            echo "v$V is on $tagged already: this run's commit of the tested tree, pushed by an earlier attempt. Going on from there."
            exit 0
          fi
          parent=$(git ls-remote "$remote" refs/heads/releases | cut -f1)
          if [ -n "$parent" ]; then
            git fetch -q --depth 1 "$remote" "$parent"
            # releases holds release commits alone: each has BUILD.json, and its message a Source-Commit: line.
            if ! git cat-file -e "$parent:BUILD.json" 2>/dev/null || ! grep -q '^Source-Commit: [0-9a-f]\{40\}$' <<<"$(git cat-file commit "$parent")"; then
              echo "::error title=releases isn't a release::releases is on $parent, which isn't a release commit: see docs/releasing.md, \"Checking the deploy key's bypass\"."
              exit 1
            fi
            commit=$(message | git commit-tree "$TREE" -p "$parent")
          else
            commit=$(message | git commit-tree "$TREE") # the first release: releases starts here
          fi
          git push --atomic "$remote" "$commit:refs/heads/releases" "$commit:refs/tags/v$V"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "Pushed $commit to releases, tagged v$V."
      # A draft until its files are on it: once published, an immutable
      # release's files and tag can't change.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          made="The release commit \`$COMMIT\` (branch \`releases\`), built from main at \`$GITHUB_SHA\` by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          # An earlier attempt of this run may have made the release: a draft
          # (its files maybe not all there) goes, to be made again. A
          # published one is done if it's this run's: a workflow's
          # (github-actions[bot]), naming this run, with this run's files and
          # no other. Anyone who can push here can make a release of a tag
          # that's there, and a published one can't be replaced: stop.
          if draft=$(gh release view "v$V" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = false ]; then
              release=$(gh api "repos/$GH_REPO/releases/tags/v$V")
              author=$(jq -r .author.login <<<"$release")
              body=$(jq -r .body <<<"$release" | tr -d '\r')
              theirs=$(jq -r '.assets[] | "\(.name) \(.digest)"' <<<"$release" | sort)
              ours=$(cd assets && for file in *; do echo "$file sha256:$(sha256sum "$file" | cut -d' ' -f1)"; done | sort)
              if [ "$author" = "github-actions[bot]" ] && [ "$theirs" = "$ours" ] && grep -qxF -- "$made" <<<"$body"; then
                echo "v$V is published already, by an earlier attempt of this run."
                exit 0
              fi
              echo "::error title=v$V has a release this run didn't make::Its author ($author), files or notes aren't this run's. A published release can't be replaced: withdraw it and release the next version (docs/releasing.md, \"A bad release\")."
              exit 1
            fi
            gh release delete "v$V" --yes
          fi
          title="BoxOps $V"
          grep -qx -- '- Security: none' notes/notes.md || title="Security: BoxOps $V"
          {
            echo "    uses: $GITHUB_REPOSITORY@$COMMIT # v$V"
            echo
            echo "$made"
            echo "What runs in a roadmap repository's workflow: \`dist/action.mjs\`, \`dist/boxops.mjs\` (unminified) and git. No network, no token, no npm, no build."
            echo "Check that \`boxops.mjs\`, the tarball or any file of the release commit came from this workflow: \`gh attestation verify <file> -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\`"
            echo
            cat notes/notes.md
          } >"$RUNNER_TEMP/body.md"
          pre=""
          if [[ "$V" == *-rc.* ]]; then pre=--prerelease; fi
          gh release create "v$V" --verify-tag --draft ${pre:+"$pre"} --title "$title" --notes-file "$RUNNER_TEMP/body.md" assets/*
          # GitHub's latest release (its releases page, releases/latest) only
          # if no published release but a withdrawn one is of a later
          # version: not a release candidate, nor a patch of an older minor
          # (docs/releasing.md, "Security releases").
          latest=false
          if [ -z "$pre" ]; then
            newest=$({
              gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName,name \
                --jq '.[] | select((.name // "") | test("^\\s*withdrawn:"; "i") | not) | .tagName'
              echo "v$V"
            } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ "$newest" = "v$V" ]; then latest=true; fi
          fi
          gh release edit "v$V" --draft=false --latest="$latest"
          echo "Published $title (GitHub's latest release: $latest): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$V"
