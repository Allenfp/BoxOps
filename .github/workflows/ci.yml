# Checks pull requests and every branch except main (which pages.yml checks
# before deploying): lint, types, unit tests (also in two far-apart time zones),
# roadmap validation, a production build, the command-line tool on the
# starter's files, the starter end to end, the browser tests (WebKit, then
# Chromium and Firefox) and the performance checks; and lints the workflows,
# this repository's, the starter's and Path B's.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions: {}

# A newer push to the same branch or pull request replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A pull request from a branch of this repo is already checked by the push
    # run on that branch, so only pull requests from forks run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Pinned on purpose: ubuntu-latest moves to Ubuntu 26.04 between 2026-10-19
    # and 2026-11-19. Move to ubuntu-26.04 in its own pull request.
    runs-on: ubuntu-24.04
    # Generous: on a private repository's 2-CPU runner Playwright runs one test
    # at a time, and the browser tests alone may take half an hour (estimated).
    timeout-minutes: 60
    permissions:
      contents: read # check out the repo
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Dates are calendar days, so nothing may depend on the runner's zone.
      # These two (UTC-8/-7 and UTC+14) are on different dates most of the day.
      - name: Unit tests (TZ=America/Los_Angeles)
        env:
          TZ: America/Los_Angeles
        run: npm test
      - name: Unit tests (TZ=Pacific/Kiritimati)
        env:
          TZ: Pacific/Kiritimati
        run: npm test
      - run: npm run validate
      - run: npm run build
      # The command-line tool and action (dist/boxops.mjs), run as a roadmap
      # repository would: on the starter's files, then writing the demo's site.
      - run: npm run build:cli
      - name: The tool on the starter, and the demo's site
        run: |
          node dist/boxops.mjs validate --root ../starter
          node dist/boxops.mjs sync --check --root ../starter
          node dist/boxops.mjs migrate --check --root ../starter
          node dist/boxops.mjs build --out "$RUNNER_TEMP/site"

      # No browser cache: the downloads are a few seconds of this step, and a
      # cache keyed only on runner.os restores the wrong Ubuntu's build.
      - name: Install the browsers
        run: npx playwright install --with-deps webkit chromium firefox
      # A roadmap repository made from the starter, end to end and offline,
      # with the build above as its release: the release's init, the
      # launcher, the action (as uses: runs it, and Path B), and the site and
      # the preview in WebKit.
      - name: The starter, end to end
        run: npx tsx scripts/starter-dry-run.ts
      # WebKit (Safari's engine) first, with the specs about dates in two more
      # time zones: Safari is the browser BoxOps is made for. Then the whole
      # suite in Chromium (Chrome, Edge) and in Firefox, which must work too.
      - name: Browser tests (WebKit)
        timeout-minutes: 20
        run: npx playwright test --project='webkit*'
      - name: Browser tests (Chromium)
        timeout-minutes: 20
        run: npx playwright test --project=chromium
      - name: Browser tests (Firefox)
        timeout-minutes: 20
        run: npx playwright test --project=firefox
      # npm run perf, on the build above: the first load of a generated
      # 2,000-box roadmap in WebKit. Blocking: its exact checks (the main
      # JavaScript file's size, no YAML parser before the timeline shows)
      # catch real regressions, and its timing fails only far above what a
      # runner takes (it's printed in the log either way).
      - name: Performance
        timeout-minutes: 5
        run: npx playwright test -c playwright.perf.config.ts
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  workflows:
    # As the test job: pushes to branches, and pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint, the release checked against its published SHA-256; it
      # runs shellcheck (on the runner image) on every run: script.
      - name: Lint the workflows (this repository's, the starter's and Path B's)
        env:
          V: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          shellcheck --version | head -n 2
          curl -fsSLo "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml starter/.github/workflows/*.yml templates/path-b/*.yml
