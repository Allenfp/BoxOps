# Checks pull requests and every branch except main (which pages.yml checks
# before deploying): lint, types, unit tests (also in two far-apart time zones),
# roadmap validation, a production build and the browser tests (WebKit).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions: {}

# A newer push to the same branch or pull request replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A pull request from a branch of this repo is already checked by the push
    # run on that branch, so only pull requests from forks run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Pinned on purpose: ubuntu-latest moves to Ubuntu 26.04 between 2026-10-19
    # and 2026-11-19. Move to ubuntu-26.04 in its own pull request.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repo
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Dates are calendar days, so nothing may depend on the runner's zone.
      # These two (UTC-8/-7 and UTC+14) are on different dates most of the day.
      - name: Unit tests (TZ=America/Los_Angeles)
        env:
          TZ: America/Los_Angeles
        run: npm test
      - name: Unit tests (TZ=Pacific/Kiritimati)
        env:
          TZ: Pacific/Kiritimati
        run: npm test
      - run: npm run validate
      - run: npm run build

      # No browser cache: the WebKit download is a few seconds of this step,
      # and a cache keyed only on runner.os restores the wrong Ubuntu's build.
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Browser tests
        timeout-minutes: 10
        run: npx playwright test
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
