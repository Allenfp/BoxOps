# Checks for pull requests and work-in-progress branches: roadmap validation,
# unit tests, a production build, and the browser tests (WebKit).
name: Checks

on:
  pull_request:
    paths: ["roadmap/**", "web/**", ".github/workflows/**"]
  push:
    branches-ignore: [main]
    paths: ["roadmap/**", "web/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Browser tests
        run: npx playwright test
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
