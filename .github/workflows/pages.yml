# Builds the roadmap app (with roadmap/ baked in) and publishes it to GitHub Pages.
# Saves from the app only change roadmap/, so they skip the browser tests and go
# live quickly; any change to the app itself must pass them before deploying.
name: Deploy roadmap to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Did anything besides roadmap data change?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            app=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qv '^roadmap/'; then
            app=true
          else
            app=false
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "App changed: $app"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build

      - name: Cache Playwright browsers
        if: steps.changes.outputs.app == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install WebKit
        if: steps.changes.outputs.app == 'true'
        run: npx playwright install --with-deps webkit
      - name: Browser tests
        if: steps.changes.outputs.app == 'true'
        run: npx playwright test
      - name: Upload browser test report
        if: failure() && steps.changes.outputs.app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
