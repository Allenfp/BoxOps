processes:
- name: Data Warehouse
  stages:
  - id: extract_load_fivetran
    display_name: 'Extract & Load: Fivetran'
    complexity: 3
    documentation_coverage: 2
    on_call: true
    comment: 'This stage covers connecting new data sources and maintaining ongoing
      syncs via Fivetran. It includes evaluating source APIs, configuring connectors,
      setting up authentication credentials, handling schema drift, sync failures,
      and API rate limits. It ends when data reliably lands in Snowflake raw schemas
      on schedule.

      '
  - id: orchestration_dagster
    display_name: 'Orchestration: Dagster'
    complexity: 4
    documentation_coverage: 2
    on_call: true
    comment: 'Orchestration manages the scheduling and dependency graph of all pipeline
      jobs via Dagster. This includes defining assets and their dependencies, configuring
      sensors for Fivetran completion, managing retry and backfill logic, and ensuring
      downstream transforms only run after upstream data is fresh. It ends when a
      pipeline runs end-to-end without manual intervention.

      '
  - id: transform_dbt_staging
    display_name: 'Transform: dbt Staging'
    complexity: 3
    documentation_coverage: 2
    on_call: false
    comment: 'The staging layer is the first dbt transformation layer. It covers writing
      staging models that rename, cast, and lightly clean raw Fivetran-landed tables.
      No business logic belongs here — just source-conformed type casting, column
      renaming to conventions, and basic deduplication. It ends when raw data is queryable
      in a consistent, typed format.

      '
  - id: transform_dbt_core
    display_name: 'Transform: dbt Core'
    complexity: 4
    documentation_coverage: 5
    on_call: false
    comment: 'The intermediate layer applies business logic to staged data. This includes
      joins across sources, grain changes, slowly changing dimension logic, business
      rule calculations, and filtering. Models here are not meant for end users directly
      but serve as building blocks for the marts layer. It ends when clean, business-conformed
      entities are available.

      '
  - id: transform_dbt_marts
    display_name: 'Transform: dbt Marts'
    complexity: 5
    documentation_coverage: 1
    on_call: false
    comment: 'The marts layer produces the final wide, denormalized tables that analysts
      and dashboards consume. This includes building fact and dimension tables, aggregated
      metrics, and role-based access views. It ends when a mart is documented, tested,
      and ready for downstream consumption in Sigma or other tools.

      '
  - id: cicd_github_dagster
    display_name: 'CI/CD: GitHub And Dagster'
    complexity: 3
    documentation_coverage: 4
    on_call: true
    comment: 'CI/CD covers the automated build and deployment pipeline using GitHub
      Actions. This includes configuring slim CI jobs that run modified dbt models
      on pull requests, managing environment-specific targets (dev/staging/prod),
      enforcing linting via sqlfluff, and gating merges on passing checks. It ends
      when code flows safely from PR to production.

      '
  - id: snowflake_iac_terraform
    display_name: 'Snowflake IaC: Terraform'
    complexity: 3
    documentation_coverage: 4
    on_call: false
    comment: 'Infrastructure as code covers provisioning and managing cloud resources
      via Terraform. This includes Snowflake account configuration, Fivetran connector
      definitions, Dagster deployment infrastructure, IAM roles, and environment parity
      between dev and prod. It ends when infrastructure changes are versioned, reviewed,
      and applied through automated pipelines.

      '
- name: MLOps
  stages:
  - id: feature_engineering_snowflake
    display_name: 'Feature Engineering: Snowflake'
    complexity: 4
    documentation_coverage: 3
    on_call: false
    comment: 'This stage covers building and maintaining feature tables in Snowflake
      for model training and inference. It includes writing SQL-based feature transforms,
      managing point-in-time correctness to prevent data leakage, and maintaining
      a feature registry. It ends when features are documented, versioned, and available
      for model consumption.

      '
  - id: experiment_tracking_mlflow
    display_name: 'Experiment Tracking: MLflow'
    complexity: 3
    documentation_coverage: 4
    on_call: false
    comment: 'Experiment tracking covers logging model training runs, hyperparameters,
      metrics, and artifacts in MLflow. It includes comparing experiment results,
      tagging promising runs, and managing the transition from experiment to registered
      model. It ends when a trained model is logged with reproducible parameters and
      metrics.

      '
  - id: model_training_sagemaker
    display_name: 'Model Training: SageMaker'
    complexity: 5
    documentation_coverage: 2
    on_call: false
    comment: 'Model training covers building, tuning, and validating machine learning
      models on AWS SageMaker. This includes configuring training jobs, managing compute
      instances, running hyperparameter tuning jobs, and evaluating model performance
      against baseline metrics. It ends when a model meets acceptance criteria and
      is ready for registration.

      '
  - id: model_registry_mlflow
    display_name: 'Model Registry: MLflow'
    complexity: 3
    documentation_coverage: 3
    on_call: false
    comment: 'The model registry manages the lifecycle of trained models from staging
      through production. It includes versioning models, managing stage transitions
      (staging, production, archived), and maintaining model metadata and lineage.
      It ends when a model version is approved and promoted to production.

      '
  - id: model_serving_sagemaker
    display_name: 'Model Serving: SageMaker Endpoints'
    complexity: 4
    documentation_coverage: 2
    on_call: true
    comment: 'Model serving covers deploying registered models to real-time or batch
      inference endpoints on SageMaker. This includes configuring endpoint auto-scaling,
      A/B testing between model versions, managing canary deployments, and monitoring
      endpoint health. It ends when a model is serving predictions reliably at the
      required latency and throughput.

      '
  - id: monitoring_evidently
    display_name: 'Monitoring: Evidently'
    complexity: 4
    documentation_coverage: 1
    on_call: true
    comment: 'Model monitoring covers tracking data drift, prediction drift, and model
      performance degradation using Evidently. It includes configuring drift detection
      thresholds, setting up alerting for model quality issues, and generating automated
      monitoring reports. It ends when degradation is detected and an alert triggers
      the retraining pipeline.

      '
  - id: orchestration_airflow
    display_name: 'Orchestration: Airflow'
    complexity: 4
    documentation_coverage: 2
    on_call: true
    comment: 'ML orchestration manages the end-to-end training and deployment pipelines
      via Apache Airflow. This includes scheduling retraining jobs, managing dependencies
      between feature generation, training, evaluation, and deployment steps, and
      handling failure recovery. It ends when ML pipelines run reliably on schedule
      without manual intervention.

      '
  - id: cicd_github_actions
    display_name: 'CI/CD: GitHub Actions'
    complexity: 3
    documentation_coverage: 2
    on_call: true
    comment: 'CI/CD for ML covers automated testing and deployment of model code and
      pipeline definitions using GitHub Actions. This includes running unit tests
      on feature transforms, validating model artifacts, linting pipeline DAGs, and
      gating deployments on passing checks. It ends when code changes flow safely
      from PR to production.

      '
  - id: iac_terraform
    display_name: 'IaC: Terraform'
    complexity: 3
    documentation_coverage: 1
    on_call: false
    comment: 'Infrastructure as code covers provisioning and managing AWS resources
      for ML workloads via Terraform. This includes SageMaker endpoints, training
      instance configurations, IAM roles, S3 buckets for model artifacts, and VPC
      networking. It ends when infrastructure changes are versioned, reviewed, and
      applied through automated pipelines.

      '
